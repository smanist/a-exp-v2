[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a-exp-v2"
version = "0.2.0"
description = "Repo-local operating layer for recurring Codex-assisted work"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[project.scripts]
a-exp-v2 = "a_exp_v2.cli:main"
a-exp = "a_exp_v2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
a_exp_v2 = [
  "doc_templates/**/*.md",
  "protocol_templates/**/*.md",
  "protocol_templates/**/*.py",
  "protocol_templates/**/*.yaml",
  "skill_templates/**/*.md",
  "schemas/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
